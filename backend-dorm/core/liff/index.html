<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7fc">
  <title>ผูกบัญชีหอพัก · DormiNetX</title>
  <link rel="stylesheet" href="/liff/styles.css">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="/liff/app.js" defer></script>
</head>
<body>
  <main class="page">
    <section class="shell" aria-labelledby="page-title">
      <header class="hero">
        <div class="app-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" role="img">
            <defs>
              <linearGradient id="icon-surface" x1="8" y1="4" x2="57" y2="60" gradientUnits="userSpaceOnUse">
                <stop stop-color="#818cf8"/>
                <stop offset="1" stop-color="#4338ca"/>
              </linearGradient>
            </defs>
            <rect x="5" y="5" width="54" height="54" rx="17" fill="url(#icon-surface)"/>
            <path d="M16 48V20.5C16 18.6 17.6 17 19.5 17h18c1.9 0 3.5 1.6 3.5 3.5V48" fill="#eef2ff" fill-opacity=".92"/>
            <path d="M41 29.5c0-1.9 1.6-3.5 3.5-3.5H49c1.7 0 3 1.3 3 3v19H41V29.5Z" fill="#c7d2fe"/>
            <path d="M28 48V39.5a4.5 4.5 0 0 1 9 0V48" fill="#fb7185"/>
            <g fill="#6366f1">
              <rect x="21" y="23" width="5" height="5" rx="1.5"/><rect x="31" y="23" width="5" height="5" rx="1.5"/>
              <rect x="21" y="31" width="5" height="5" rx="1.5"/><rect x="31" y="31" width="5" height="5" rx="1.5"/>
              <rect x="45" y="32" width="4" height="5" rx="1.3"/>
            </g>
            <path d="M13 48h42" stroke="#312e81" stroke-width="3.5" stroke-linecap="round"/>
          </svg>
        </div>
        <p class="brand-name">DormiNetX</p>
        <h1 id="page-title">ผูกบัญชีหอพัก</h1>
        <p class="intro">กรอกเบอร์โทรที่แจ้งกับหอพัก<br>ระบบจะแสดงห้องของคุณเพื่อยืนยัน</p>
      </header>

      <section class="panel">
        <div id="loading" class="status status-loading" role="status">
          <span class="spinner" aria-hidden="true"></span>
          <span>กำลังตรวจสอบบัญชี LINE…</span>
        </div>

        <div id="notice" class="status" role="alert" hidden></div>

        <form id="link-form" hidden>
          <div class="account-row">
            <div class="line-bubble" aria-hidden="true">
              <svg viewBox="0 0 28 28"><path d="M24.5 12.2c0-5-4.7-9-10.5-9s-10.5 4-10.5 9c0 4.5 4 8.3 9.3 9 .4.1.9.3 1 .7.1.3.1.9 0 1.2l-.2 1c-.1.3-.3 1.4 1.3.8 1.6-.7 8.6-5.1 11.7-8.7 1.3-1.4 1.9-3.1 1.9-4.8Z" fill="currentColor" transform="translate(-.5 1) scale(.92)"/></svg>
            </div>
            <div><small>บัญชี LINE</small><p id="line-name" class="line-name"></p></div>
            <span class="verified-badge" aria-label="ยืนยันแล้ว">✓</span>
          </div>

          <div class="field-group">
            <label for="phone">เบอร์โทรศัพท์ที่แจ้งกับหอพัก</label>
            <div class="control">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7.2 3.5 9.7 8 7.9 9.8c1.1 2.5 3.1 4.5 5.6 5.6l1.8-1.8 4.5 2.5v3.1c0 1-1 1.8-2 1.7C9.7 20.2 3.2 13.7 2.5 5.6c-.1-1 .7-2 1.7-2h3Z"/></svg>
              <input
                id="phone"
                name="phone"
                type="tel"
                inputmode="numeric"
                autocomplete="tel"
                maxlength="14"
                placeholder="0812345678"
                required
              >
            </div>
            <p class="hint">ใช้เพื่อค้นหาห้องเท่านั้น ระบบจะไม่แสดงเบอร์โทรในแชต</p>
          </div>

          <button id="verify-button" class="primary-button" type="submit">
            <span>ค้นหาห้องของฉัน</span>
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </form>

        <section id="confirmation" class="confirmation" hidden aria-live="polite">
          <div class="success-mark" aria-hidden="true">✓</div>
          <p class="result-label">พบข้อมูลของคุณ</p>
          <h2 id="confirmation-text"></h2>
          <p class="confirmation-note">ตรวจสอบเลขห้องให้ถูกต้องก่อนเชื่อมบัญชี</p>
          <button id="link-button" class="primary-button" type="button">ยืนยันการผูกบัญชี</button>
          <button id="back-button" class="button-secondary" type="button">แก้ไขเบอร์โทร</button>
        </section>
      </section>

      <p class="privacy-note">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.7 2.8 8.5 7 10 4.2-1.5 7-5.3 7-10V6l-7-3Zm-3 9 2 2 4-4"/></svg>
        ข้อมูลถูกเข้ารหัสและใช้เพื่อยืนยันบัญชีเท่านั้น
      </p>
    </section>
  </main>
</body>
</html>
